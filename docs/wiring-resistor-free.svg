<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
<defs><style>
.bg{fill:#f1f5fb} .panel{fill:#ffffff;stroke:#d7e1ef;stroke-width:3} .title{font:700 36px Arial,sans-serif;fill:#172b4d} .subtitle{font:500 19px Arial,sans-serif;fill:#526581} .label{font:700 20px Arial,sans-serif;fill:#22334d} .small{font:500 17px Arial,sans-serif;fill:#526581} .tiny{font:500 14px Arial,sans-serif;fill:#526581} .esp{fill:#1d3557;stroke:#36547b;stroke-width:2} .esptxt{font:700 22px Arial,sans-serif;fill:white} .wire{fill:none;stroke:#2182c5;stroke-width:5;stroke-linecap:round;stroke-linejoin:round} .vcc{fill:none;stroke:#de6661;stroke-width:5;stroke-linecap:round} .fsr{fill:#dcf4e8;stroke:#4aa77d;stroke-width:3} .vbox{fill:#fff0ef;stroke:#f2c3c1;stroke-width:2} .pill{fill:#e4edff;stroke:#c0d4fa;stroke-width:2} .note{fill:#fff6dd;stroke:#f0d78d;stroke-width:2} .notetxt{font:600 18px Arial,sans-serif;fill:#735519} .dot{fill:#52b6ef} .divider{stroke:#e6edf6;stroke-width:2}
</style></defs>
<rect class="bg" x="0" y="0" width="1800" height="1080"/>
<text class="title" x="50" y="62">Resistor-free FSR wiring — temporary digital trigger</text>
<text class="subtitle" x="50" y="98">For the current firmware default • classic ESP32 Dev Module • one FSR between 3V3 and each GPIO</text>
<rect class="panel" x="35" y="130" width="850" height="725" rx="24"/><rect class="panel" x="915" y="130" width="850" height="725" rx="24"/><text class="label" x="75" y="183">LEFT ESP32 • Birds / Ball / Cat</text><text class="label" x="955" y="183">RIGHT ESP32 • Dog / Mom / Dad</text><rect class="pill" x="70" y="215" width="100" height="70" rx="12"/><text class="label" x="120" y="257" text-anchor="middle">3V3</text><path class="vcc" d="M 170 250 H 215"/><rect class="fsr" x="215" y="215" width="190" height="70" rx="12"/><text class="label" x="310" y="247" text-anchor="middle">FSR Birds</text><text class="tiny" x="310" y="270" text-anchor="middle">two leads</text><path class="wire" d="M 405 250 H 480"/><circle class="dot" cx="480" cy="250" r="6"/><path class="wire" d="M 480 250 H 595"/><rect class="esp" x="595" y="210" width="230" height="80" rx="14"/><text class="esptxt" x="710" y="245" text-anchor="middle">GPIO 32</text><text class="tiny" x="710" y="269" text-anchor="middle" fill="#dce8fa">Birds sensor input</text><rect class="pill" x="70" y="400" width="100" height="70" rx="12"/><text class="label" x="120" y="442" text-anchor="middle">3V3</text><path class="vcc" d="M 170 435 H 215"/><rect class="fsr" x="215" y="400" width="190" height="70" rx="12"/><text class="label" x="310" y="432" text-anchor="middle">FSR Ball</text><text class="tiny" x="310" y="455" text-anchor="middle">two leads</text><path class="wire" d="M 405 435 H 480"/><circle class="dot" cx="480" cy="435" r="6"/><path class="wire" d="M 480 435 H 595"/><rect class="esp" x="595" y="395" width="230" height="80" rx="14"/><text class="esptxt" x="710" y="430" text-anchor="middle">GPIO 33</text><text class="tiny" x="710" y="454" text-anchor="middle" fill="#dce8fa">Ball sensor input</text><rect class="pill" x="70" y="585" width="100" height="70" rx="12"/><text class="label" x="120" y="627" text-anchor="middle">3V3</text><path class="vcc" d="M 170 620 H 215"/><rect class="fsr" x="215" y="585" width="190" height="70" rx="12"/><text class="label" x="310" y="617" text-anchor="middle">FSR Cat</text><text class="tiny" x="310" y="640" text-anchor="middle">two leads</text><path class="wire" d="M 405 620 H 480"/><circle class="dot" cx="480" cy="620" r="6"/><path class="wire" d="M 480 620 H 595"/><rect class="esp" x="595" y="580" width="230" height="80" rx="14"/><text class="esptxt" x="710" y="615" text-anchor="middle">GPIO 25</text><text class="tiny" x="710" y="639" text-anchor="middle" fill="#dce8fa">Cat sensor input</text><rect class="pill" x="950" y="215" width="100" height="70" rx="12"/><text class="label" x="1000" y="257" text-anchor="middle">3V3</text><path class="vcc" d="M 1050 250 H 1095"/><rect class="fsr" x="1095" y="215" width="190" height="70" rx="12"/><text class="label" x="1190" y="247" text-anchor="middle">FSR Dog</text><text class="tiny" x="1190" y="270" text-anchor="middle">two leads</text><path class="wire" d="M 1285 250 H 1360"/><circle class="dot" cx="1360" cy="250" r="6"/><path class="wire" d="M 1360 250 H 1475"/><rect class="esp" x="1475" y="210" width="230" height="80" rx="14"/><text class="esptxt" x="1590" y="245" text-anchor="middle">GPIO 26</text><text class="tiny" x="1590" y="269" text-anchor="middle" fill="#dce8fa">Dog sensor input</text><rect class="pill" x="950" y="400" width="100" height="70" rx="12"/><text class="label" x="1000" y="442" text-anchor="middle">3V3</text><path class="vcc" d="M 1050 435 H 1095"/><rect class="fsr" x="1095" y="400" width="190" height="70" rx="12"/><text class="label" x="1190" y="432" text-anchor="middle">FSR Mom</text><text class="tiny" x="1190" y="455" text-anchor="middle">two leads</text><path class="wire" d="M 1285 435 H 1360"/><circle class="dot" cx="1360" cy="435" r="6"/><path class="wire" d="M 1360 435 H 1475"/><rect class="esp" x="1475" y="395" width="230" height="80" rx="14"/><text class="esptxt" x="1590" y="430" text-anchor="middle">GPIO 27</text><text class="tiny" x="1590" y="454" text-anchor="middle" fill="#dce8fa">Mom sensor input</text><rect class="pill" x="950" y="585" width="100" height="70" rx="12"/><text class="label" x="1000" y="627" text-anchor="middle">3V3</text><path class="vcc" d="M 1050 620 H 1095"/><rect class="fsr" x="1095" y="585" width="190" height="70" rx="12"/><text class="label" x="1190" y="617" text-anchor="middle">FSR Dad</text><text class="tiny" x="1190" y="640" text-anchor="middle">two leads</text><path class="wire" d="M 1285 620 H 1360"/><circle class="dot" cx="1360" cy="620" r="6"/><path class="wire" d="M 1360 620 H 1475"/><rect class="esp" x="1475" y="580" width="230" height="80" rx="14"/><text class="esptxt" x="1590" y="615" text-anchor="middle">GPIO 14</text><text class="tiny" x="1590" y="639" text-anchor="middle" fill="#dce8fa">Dad sensor input</text><rect class="note" x="55" y="880" width="1690" height="145" rx="18"/><text class="notetxt" x="82" y="922">WIRING FOR EACH SENSOR</text><text class="small" x="82" y="958">FSR lead 1 → ESP32 3V3. FSR lead 2 → its own GPIO pin. Do not connect the FSR directly to GND.</text><text class="small" x="82" y="991">Firmware uses INPUT_PULLDOWN: released is usually LOW; pressing should drive the pin HIGH. Use separate GPIOs for all six sensors.</text><text class="tiny" x="82" y="1015">This no-resistor mode is experimental and detects a press only; it cannot measure calibrated force. Never use 5V on ESP32 GPIO pins.</text></svg>