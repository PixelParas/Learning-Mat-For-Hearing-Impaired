<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f7fc"/><stop offset="1" stop-color="#e9eef8"/></linearGradient><style>.title{font:800 32px Inter,Arial,sans-serif;fill:#182944}.sub{font:15px Inter,Arial,sans-serif;fill:#64728a}.head{font:800 21px Inter,Arial,sans-serif;fill:#182944}.body{font:14px Inter,Arial,sans-serif;fill:#43536c}.small{font:12px Inter,Arial,sans-serif;fill:#66758c}.white{fill:#fff}.arrow{stroke:#6683b2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs>
<rect width="1400" height="850" fill="url(#bg)"/>
<text x="50" y="55" class="title">Inclusive Learning Mat — system architecture</text><text x="50" y="82" class="sub">Dashboard → Express command router → selected ESP32(s) → assigned JBL speaker</text>
<rect x="390" y="112" width="620" height="150" rx="22" fill="#fff" stroke="#d7e0ef" stroke-width="2"/>
<rect x="415" y="137" width="64" height="64" rx="16" fill="#1c3154"/><text x="447" y="177" text-anchor="middle" font-family="Arial" font-weight="800" font-size="21" fill="#fff">UI</text>
<text x="505" y="151" class="head">Web dashboard</text><text x="505" y="181" class="body">Birds · Ball · Cat · Dog · Mom · Dad</text><text x="505" y="207" class="body">Left / Right checkboxes · Repeat · Success feedback</text><text x="505" y="232" class="small">POST /api/play (repeat flag) · polls /api/state</text>
<path d="M700 262 V310" class="arrow"/><path d="M691 301 L700 311 L709 301" class="arrow"/>
<rect x="310" y="315" width="780" height="150" rx="22" fill="#fff" stroke="#d7e0ef" stroke-width="2"/>
<rect x="338" y="340" width="62" height="62" rx="15" fill="#dbe8ff"/><text x="369" y="378" text-anchor="middle" font-family="Arial" font-weight="800" font-size="21" fill="#2e59b6">API</text>
<text x="425" y="345" class="head">Express backend</text><text x="425" y="376" class="body">Remembers last request and active target</text><text x="425" y="402" class="body">Queues a command for selected device(s)</text><text x="425" y="428" class="body">Checks sensor labels and records success in memory</text><text x="425" y="450" class="small">Device endpoints protected by X-Device-Key</text>
<path d="M700 465 V500 H355 V530" class="arrow"/><path d="M700 500 H1045 V530" class="arrow"/><path d="M346 521 L355 531 L364 521" class="arrow"/><path d="M1036 521 L1045 531 L1054 521" class="arrow"/>
<rect x="70" y="535" width="570" height="230" rx="22" fill="#fff" stroke="#cedcf4" stroke-width="2"/>
<rect x="760" y="535" width="570" height="230" rx="22" fill="#fff" stroke="#cde9dc" stroke-width="2"/>
<rect x="95" y="560" width="55" height="55" rx="14" fill="#dce8ff"/><text x="122" y="594" text-anchor="middle" font-family="Arial" font-weight="800" font-size="20" fill="#2e59b6">L</text>
<text x="169" y="568" class="head">Left ESP32</text><text x="169" y="593" class="body">Wi-Fi + SPIFFS + MP3 decoder + A2DP</text><text x="100" y="638" class="body">FSR sensors: Birds, Ball, Cat</text><text x="100" y="664" class="body">GPIO 32, 33, 34 (analog mode)</text><text x="100" y="690" class="body">Files: all six MP3s stored locally</text><text x="100" y="718" class="body">Bluetooth → Left JBL M4</text><text x="100" y="745" class="small">Reports sensor presses; polls selected commands</text>
<rect x="785" y="560" width="55" height="55" rx="14" fill="#dff5e9"/><text x="812" y="594" text-anchor="middle" font-family="Arial" font-weight="800" font-size="20" fill="#21805b">R</text>
<text x="859" y="568" class="head">Right ESP32</text><text x="859" y="593" class="body">Wi-Fi + SPIFFS + MP3 decoder + A2DP</text><text x="790" y="638" class="body">FSR sensors: Dog, Mom, Dad</text><text x="790" y="664" class="body">GPIO 35, 36, 39 (analog mode)</text><text x="790" y="690" class="body">Files: all six MP3s stored locally</text><text x="790" y="718" class="body">Bluetooth → Right JBL M4</text><text x="790" y="745" class="small">Reports sensor presses; polls selected commands</text>
<text x="50" y="812" class="small">Prototype: server state is in-memory. Two Bluetooth speakers are near-simultaneous, not perfectly synchronized.</text>
</svg>
